<div id="header" class="mb-[10rem]">
    <header class="fixed top-0 left-0 z-50 w-full grid grid-cols-3 items-center px-6 md:px-10 py-5 font-sans bg-transparent">
        <!-- Left: language switcher -->
        <div class="flex flex-col text-[15px] font-medium text-gray-900 leading-relaxed relative z-10 justify-self-start">
            <a href="#" class="hover:opacity-60 cursor-pointer text-base sm:text-lg md:text-[15px]">DE</a>
            <a href="#" class="hover:opacity-60 cursor-pointer text-base sm:text-lg md:text-[15px]">EN</a>
        </div>

        <!-- Center: logo -->
        <div class="relative inline-block justify-self-center">
            <img
                src="/src/Assets/Vector_5(header shape).png"
                alt=""
                aria-hidden="true"
                class="md:hidden absolute top-0 left-0 w-[130%] h-[210%] -translate-x-1/2 -translate-y-1/2 -z-10 object-contain pointer-events-none select-none"
                onerror="this.style.display='none'"
            />
            <h1 class="relative text-2xl sm:text-2xl md:text-4xl lg:text-5xl font-extrabold tracking-tight text-gray-900 z-10 whitespace-nowrap">
                Baumeister
            </h1>
        </div>

        <!-- Right: nav links (desktop) -->
        <nav id="nav-links-desktop" class="hidden md:flex flex-col items-end text-[15px] lg:text-base font-medium text-gray-900 leading-relaxed relative z-10 justify-self-end">
            <a href="#about" class="hover:opacity-60 cursor-pointer">About</a>
            <a href="#services" class="hover:opacity-60 cursor-pointer">Services</a>
            <a href="#references" class="hover:opacity-60 cursor-pointer">References</a>
            <a href="#" class="hover:opacity-60 cursor-pointer">Contact</a>
        </nav>

        <!-- Right: burger / X toggle (mobile) -->
        <button id="nav-toggle-btn" aria-label="Toggle menu" aria-expanded="false"
            class="md:hidden flex flex-col justify-center items-center w-8 h-8 self-start gap-[5px] relative z-10 justify-self-end">
            <img src="/src/Assets/Green_burger_menu.png" alt="Menu" class="w-[39px] h-[23px]">
        </button>

        <!-- Mobile dropdown menu -->
        <nav id="nav-links-mobile"
            class="hidden md:hidden absolute top-full left-0 w-full bg-white flex flex-col items-center gap-4 py-6 text-base font-medium text-gray-900 shadow-md z-50 col-span-3">
            <img src="/src/Assets/X_icon.png" alt="Close" class="w-[39px] h-[23px] self-end mr-6 cursor-pointer" id="nav-close-btn">
        </nav>
    </header>
</div>
