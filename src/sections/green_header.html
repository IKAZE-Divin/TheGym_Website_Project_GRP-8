<div id="header" class="mb-[10rem]">
    <header id="site-header" class="fixed top-0 left-0 z-50 w-full font-sans bg-transparent">
        <!-- Row wrapper now owns the grid, not the whole header -->
        <div class="grid grid-cols-3 items-center px-6 md:px-10 py-5">
            <!-- Left: language switcher -->
            <div class="flex flex-col text-[15px] font-medium leading-relaxed relative z-10 justify-self-start">
                <a href="#" class="hover:opacity-60 cursor-pointer text-base sm:text-lg md:text-[15px]">DE</a>
                <a href="#" class="hover:opacity-60 cursor-pointer text-base sm:text-lg md:text-[15px]">EN</a>
            </div>

            <!-- Center: logo -->
            <div class="relative inline-block justify-self-center">
                <img
                    src="/src/Assets/Vector_5(header shape).png"
                    alt=""
                    aria-hidden="true"
                    class="md:hidden absolute top-0 left-0 w-[130%] h-[210%] -translate-x-1/2 -translate-y-1/2 -z-10 object-contain pointer-events-none select-none"
                    onerror="this.style.display='none'"
                />
                <h1 class="relative text-2xl sm:text-2xl md:text-4xl lg:text-5xl font-extrabold tracking-tight z-10 whitespace-nowrap">
                    Baumeister
                </h1>
            </div>

            <!-- Right: nav links (desktop) -->
            <nav id="nav-links-desktop"
                class="hidden lg:flex flex-col items-end text-[15px] lg:text-base font-medium leading-relaxed relative z-10 justify-self-end">
                <a href="#" class="hover:opacity-60 cursor-pointer">About</a>
                <a href="#" class="hover:opacity-60 cursor-pointer">Services</a>
                <a href="#" class="hover:opacity-60 cursor-pointer">References</a>
                <a href="#" class="hover:opacity-60 cursor-pointer">Contact</a>
            </nav>

            <!-- Right: burger / X toggle (mobile) -->
            <button id="nav-toggle-btn" aria-label="Toggle menu" aria-expanded="false"
                class="lg:hidden flex flex-col justify-center items-center w-8 h-8 self-start gap-[5px] relative z-[60] justify-self-end">
                <img src="/src/Assets/Green_burger_menu.png" alt="Menu" class="w-[39px] h-[23px]" id="Green_burger_menu">
                <img src="/src/Assets/Green_x_icon.png" alt="Close" class="w-[39px] h-[23px] hidden absolute" id="Green_x_icon">
            </button>
        </div>

        <!-- Mobile dropdown menu — sibling of the row div, not a grid item -->
        <nav id="nav-links-mobile"
    style="max-height: 0px; opacity: 0; overflow: hidden; pointer-events: none;"
    class="absolute top-full left-0 w-full z-40 flex flex-col items-center justify-start gap-2 bg-transparent transition-all duration-300 ease-in-out">
            <a href="#" class="hover:opacity-60 cursor-pointer text-xl font-medium">About</a>
            <a href="#" class="hover:opacity-60 cursor-pointer text-xl font-medium">Service</a>
            <a href="#" class="hover:opacity-60 cursor-pointer text-xl font-medium">References</a>
            <a href="#" class="hover:opacity-60 cursor-pointer text-xl font-medium">Contact</a>
            <div class="pb-6"></div>
        </nav>
    </header>
</div>
