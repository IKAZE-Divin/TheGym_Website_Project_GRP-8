<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --font-outfit: "Outfit", sans-serif;
        }
        #header,
        #header * {
            color: #00672E !important;
        }
    </style>
</head>
<script>
    const loadComponents = (id, url, callback) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
                if (callback) callback();
            })
            .catch((err) => {
                console.info("Failed to load component:", url);
                console.info(err);
            });
    };

   const initHeaderToggle = () => {
    const toggleBtn = document.getElementById('nav-toggle-btn');
    const burgerIcon = document.getElementById('Green_burger_menu');
    const xIcon = document.getElementById('Green_x_icon');
    const mobileNav = document.getElementById('nav-links-mobile');

    if (!toggleBtn) return;

    const openMenu = () => {
        burgerIcon.style.display = 'none';
        xIcon.style.display = 'block';
        mobileNav.style.maxHeight = '600px'; // generous fixed value, no measuring needed
        mobileNav.style.opacity = '1';
        mobileNav.style.pointerEvents = 'auto';
        toggleBtn.setAttribute('aria-expanded', 'true');
    };

    const closeMenu = () => {
        burgerIcon.style.display = 'block';
        xIcon.style.display = 'none';
        mobileNav.style.maxHeight = '0px';
        mobileNav.style.opacity = '0';
        mobileNav.style.pointerEvents = 'none';
        toggleBtn.setAttribute('aria-expanded', 'false');
    };

    closeMenu();

    toggleBtn.addEventListener('click', () => {
        const isOpen = toggleBtn.getAttribute('aria-expanded') === 'true';
        isOpen ? closeMenu() : openMenu();
    });

    mobileNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', closeMenu);
    });
};

    window.onload = () => {
        loadComponents("green_header", "src/sections/green_header.html", initHeaderToggle);
        loadComponents("policies", "src/page3/policies.html");
        loadComponents("footer", "src/sections/footer.html");
    };
</script>

<body class="bg-[#EFECEA] text-[#00672E] font-outfit" id="policies_page">
    <div id="green_header"></div>
    <div id="policies"></div>
    <div id="footer"></div>
</body>
</html>
